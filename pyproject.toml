[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-agent"
version = "1.0.0"
description = "Autonomous Video Production and Editing Engine"
readme = "PROJECT.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "edge-tts>=6.1.0",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "moviepy>=2.0.0",
    "pydub>=0.25.1",
    "questionary>=2.0.0",
]

[project.scripts]
video-agent = "video_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["video_agent*"]
